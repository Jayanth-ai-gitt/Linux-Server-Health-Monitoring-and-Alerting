name: Project 02 CI

# Only run when project-02 (or this workflow) changes
on:
  push:
    branches: [main]
    paths:
      - "project-02-dockerized-app-cicd/**"
      - ".github/workflows/project-02-ci.yml"
  pull_request:
    paths:
      - "project-02-dockerized-app-cicd/**"
      - ".github/workflows/project-02-ci.yml"

# All `run:` steps execute inside the project folder
defaults:
  run:
    working-directory: project-02-dockerized-app-cicd

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: project-02-dockerized-app-cicd/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (flake8)
        run: flake8 app tests --max-line-length=100

      - name: Run unit tests
        run: pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: test            # only runs if tests passed
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devops-demo:${{ github.sha }} .

      - name: Smoke test the container
        run: |
          docker run -d --name demo -p 5000:5000 devops-demo:${{ github.sha }}
          sleep 5
          ./scripts/healthcheck.sh http://localhost:5000/health
          docker logs demo
